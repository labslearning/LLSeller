version: '3.8'

# =========================================================================================
# 🌐 SOVEREIGN INTELLIGENCE CLUSTER | OMEGA TIER ARCHITECTURE (FINAL GOLD BUILD)
# -----------------------------------------------------------------------------------------
# Framework:   Django + Celery + Redis + PostgreSQL + Tor Proxy
# Environment: Parrot OS / Kali Linux (Native Host Mode Kernel Bypass)
# Standards:   Silicon Valley SRE / Tel Aviv Offensive Security / Zero-Copy I/O
# =========================================================================================

# ---------------------------------------------------------
# [1] ANCHORS & ALIASES (DRY PRINCIPLE)
# ---------------------------------------------------------
x-common-env: &common-env
  # [FIREWALL BYPASS]: Ruteo en capa 3 directo. Se evita la latencia de resolución de DNS de Docker.
  DATABASE_URL: postgres://sovereign_db_user:9967112fhr@127.0.0.1:5454/sovereign_db
  # [ENV INJECTION]: Al definir el broker aquí, eliminamos la necesidad de pasarlo por CLI (Evita errores sintácticos)
  CELERY_BROKER_URL: redis://127.0.0.1:6379/0
  CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/0
  POSTGRES_HOST: 127.0.0.1
  REDIS_HOST: 127.0.0.1
  TZ: "America/Bogota"

x-logging: &default-logging
  driver: "json-file"
  options:
    # [DISK I/O OPTIMIZATION]: Rotación matemática para evitar que los logs ahoguen el SSD
    max-size: "20m"
    max-file: "3"
    compress: "true"

x-security: &default-security
  security_opt:
    # [KERNEL SHIELD]: Previene escalada de privilegios a Root a través de exploits SUID/SGID
    - no-new-privileges:true
  # [ZOMBIE REAPER]: Inyecta Tini como PID 1. Evita fugas de memoria por subprocesos huérfanos.
  init: true

services:
  # =========================================================
  # 🏛️ THE VAULT (PostgreSQL - Data Persistence Layer)
  # =========================================================
  db:
    image: postgres:15-alpine
    container_name: sovereign_db
    restart: unless-stopped
    network_mode: "host"
    <<: *default-security
    
    # [MEMORY TUNING]: 1GB de RAM dedicada a memoria compartida para Bulk Inserts masivos y Hash Joins
    shm_size: '1gb'
    
    # [ENGINE TWEAKS]: Maximizamos conexiones y buffers para ingesta masiva (Scraping concurrente)
    command: postgres -p 5454 -c max_connections=500 -c shared_buffers=512MB -c effective_cache_size=1536MB
    volumes:
      - postgres_data:/var/lib/postgresql/data:Z
    environment:
      POSTGRES_USER: sovereign_db_user
      POSTGRES_PASSWORD: 9967112fhr
      POSTGRES_DB: sovereign_db
    logging: *default-logging
    healthcheck:
      # Verificación de capa de sockets nativa
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5454 -U sovereign_db_user -d sovereign_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # =========================================================
  # 🧠 NEURAL MEMORY (Redis - High Throughput Message Broker)
  # =========================================================
  redis:
    image: redis:7-alpine
    container_name: sovereign_redis
    restart: unless-stopped
    network_mode: "host"
    <<: *default-security
    volumes:
      - redis_data:/data:Z
    
    # [KERNEL BIND & BURST CONTROL]: 
    # 1. Bind estricto a IPv4 (127.0.0.1) para mitigar escaneos de red.
    # 2. tcp-backlog 511: Permite encolar ráfagas masivas de señales de los workers sin descartar paquetes TCP.
    command: redis-server --bind 127.0.0.1 --save 60 1 --loglevel warning --appendonly yes --tcp-backlog 511
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -h 127.0.0.1 ping | grep PONG || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # =========================================================
  # 🌐 COMMAND CENTER (Django + Gunicorn - Control Plane)
  # =========================================================
  web:
    build: .
    container_name: sovereign_web
    restart: unless-stopped
    network_mode: "host"
    <<: *default-security
    
    # [ASYNC WORKERS]: Uvicorn asíncrono para manejar WebSockets concurrentes sin bloquear hilos
    command: gunicorn core.asgi:application -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000 --workers 3 --threads 2
    volumes:
      - static_volume:/app/staticfiles:Z
    env_file:
      - .env
    environment:
      <<: *common-env
      BOOTSTRAP_MODE: full
    logging: *default-logging
    healthcheck:
      # [FIXED]: Se reemplazó el escape '\|' por el uso de múltiples banderas '-e' en grep para cumplir con el estándar YAML.
      test: ["CMD-SHELL", "wget --quiet --server-response http://127.0.0.1:8000/admin/login/ 2>&1 | grep -q -e 'HTTP/1.1 200' -e 'HTTP/1.1 302' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # =========================================================
  # 🎯 GHOST SNIPER FLEET (Celery Workers - Execution Engine)
  # =========================================================
  celery_worker:
    build: .
    container_name: sovereign_celery_worker
    restart: unless-stopped
    network_mode: "host"
    <<: *default-security
    
    # [GRACEFUL DEGRADATION]: 180 segundos de margen matemático para cerrar navegadores y vaciar pipelines sin pérdida de datos.
    stop_grace_period: 3m
    
    # [DOM RENDER BUFFER]: 2GB asignados al motor de renderizado de Chromium (Playwright). Previene colapsos V8.
    shm_size: '2gb' 
    
    # [KERNEL SOCKET TUNING]: Permite al proceso instanciar hasta 65,536 descriptores de red simultáneos.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
        
    # [CLEAN CLI EXECUTION]: Se ha eliminado el flag '-b' problemático. Celery usa la variable de entorno automáticamente.
    command: celery -A core worker -l info -E -Q discovery_queue,scraping_queue,default,celery --concurrency=4 --prefetch-multiplier=1 --max-tasks-per-child=50
    env_file:
      - .env
    environment:
      <<: *common-env
      BOOTSTRAP_MODE: none
    logging: *default-logging

  # =========================================================
  # ⏱️ THE MASTER CLOCK (Celery Beat - Cron Scheduler)
  # =========================================================
  celery_beat:
    build: .
    container_name: sovereign_celery_beat
    restart: unless-stopped
    network_mode: "host"
    <<: *default-security
    command: celery -A core beat -l info --pidfile=
    env_file:
      - .env
    environment:
      <<: *common-env
      BOOTSTRAP_MODE: none
    logging: *default-logging

  # =========================================================
  # 👁️ OVERSEER (Celery Flower - Swarm Telemetry)
  # =========================================================
  celery_flower:
    build: .
    container_name: sovereign_flower
    restart: unless-stopped
    network_mode: "host"
    <<: *default-security
    
    # [CLEAN CLI EXECUTION]: Argumentos depurados para integrarse limpiamente con Celery 5.x+
    command: celery -A core flower --port=5555 --address=127.0.0.1 --basic_auth=admin:SovereignAdmin2026!
    env_file:
      - .env
    environment:
      <<: *common-env
      BOOTSTRAP_MODE: none
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider --http-user=admin --http-password='SovereignAdmin2026!' http://127.0.0.1:5555/ || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 25s

  # =========================================================
  # 👻 THE GHOST ROUTER (Tor Proxy Network - WAF BYPASS LAYER)
  # =========================================================
  tor_proxy:
    image: dperson/torproxy
    container_name: sovereign_tor
    restart: unless-stopped
    network_mode: "host"
    <<: *default-security
    
    # [ZERO-COPY I/O]: Montamos todas las rutas operativas de Tor directamente en la memoria RAM.
    # Controlamos el tamaño para evitar "Memory Leaks" (OOM).
    tmpfs:
      - /var/lib/tor:size=15M,mode=0700
      - /tmp:size=10M
      - /run:size=10M
      - /var/log/tor:size=15M

    environment:
      - PASSWORD=sovereign_tor_secret
      - TZ="America/Bogota"

    # [HIGH-FREQUENCY ROUTING]: Aumenta el límite de FDs para soportar miles de circuitos simultáneos.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

    # 🚀 [THE GOD TIER INJECTION - PRIVILEGE ESCALATION FIX] 🚀
    user: "root"
    entrypoint: 
      - /bin/sh
      - -c
      - |
        mkdir -p /var/lib/tor /var/log/tor
        chown -R tor:tor /var/lib/tor /var/log/tor
        chmod 700 /var/lib/tor
        exec tini -- sudo -u tor tor --SocksPort 127.0.0.1:9050 --ControlPort 127.0.0.1:9051 --DataDirectory /var/lib/tor --AvoidDiskWrites 1 --MaxCircuitDirtiness 15 --CircuitBuildTimeout 10 --NumEntryGuards 8 --Log "notice stdout"

    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9050 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

# =========================================================
# DEFINICIÓN DE VOLÚMENES PERSISTENTES
# =========================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  static_volume:
    driver: local